# Web Server
server:
  servlet:
    context-path: /f1rstTest/api

# Database
# Valores s�o carregados do Parameter Store ou vari�veis de ambiente
# Ordem de preced�ncia: System Property (Parameter Store) > Environment Variable > Default
spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/f1rstdb?currentSchema=f1rst}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: f1rst
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: f1rst

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html